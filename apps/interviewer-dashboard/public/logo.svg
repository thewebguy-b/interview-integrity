<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="url(#grad1)" filter="url(#glow)"/>

  <!-- Shield Shape -->
  <path d="M50 24 L68 32 C68 52 50 68 50 68 C50 68 32 52 32 32 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Checkmark / Pulse inside shield -->
  <path d="M43 46 L48 51 L58 40" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
